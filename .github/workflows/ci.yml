name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-static-analysis:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint lizard

      - name: Run Flake8
        run: |
          echo "=== FLAKE8 REPORT ==="
          flake8 src/ --max-line-length=120 --exit-zero

      - name: Run Pylint
        run: |
          echo "=== PYLINT REPORT ==="
          pylint src/ --disable=C0114,C0115,C0116 --exit-zero

      - name: Run Lizard (Cyclomatic Complexity)
        run: |
          echo "=== CYCLOMATIC COMPLEXITY REPORT ==="
          lizard src/ -l python -C 10 -w

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run integration tests
        run: |
          pytest tests/ -v

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test summary
        run: |
          echo "# Test Report" > test-summary.md
          echo "" >> test-summary.md
          echo "## Pipeline Status" >> test-summary.md
          echo "- Lint and Static Analysis: ${{ needs.lint-and-static-analysis.result }}" >> test-summary.md
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> test-summary.md
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> test-summary.md
          echo "" >> test-summary.md
          echo "Generated at: $(date)" >> test-summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md
          retention-days: 7